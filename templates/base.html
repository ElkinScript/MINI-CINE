{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini Cine{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="text-light">
<div id="preloader"
     style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;">
    <div id="lottie-preloader" style="width: 200px; height: 200px;"></div>
</div>

<button class="scroll-to-top" id="scrollToTop" aria-label="Volver arriba">
    <i class="fas fa-chevron-up"></i>
</button>

{% include 'navbar.html' %}
{% block content %}{% endblock %}
{% include 'footer.html' %}

<!-- Bootstrap Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    var animation = lottie.loadAnimation({
        container: document.getElementById('lottie-preloader'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: "{% static 'json/Popcorn.json' %}"
    });

    window.addEventListener('load', function () {
        var preloader = document.getElementById('preloader');
        preloader.style.opacity = '0';
        setTimeout(function () {
            preloader.style.display = 'none';
        }, 500);
    });

    const scrollToTopBtn = document.getElementById('scrollToTop');

    window.addEventListener('scroll', function () {
        if (window.pageYOffset > 300) {
            scrollToTopBtn.classList.add('show');
        } else {
            scrollToTopBtn.classList.remove('show');
        }
    });

    scrollToTopBtn.addEventListener('click', function () {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
