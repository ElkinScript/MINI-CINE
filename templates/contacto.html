{% extends "base.html" %}
{% load static %}
{% load i18n %}

{% block title %}Contacto{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold">
                    📧 <span class="text-warning">Contáctanos</span> 📧
                </h1>
                <p class="lead text-light">¿Tienes alguna pregunta o sugerencia?</p>
                <div class="border-bottom border-warning w-25 mx-auto"></div>
            </div>

            <div class="card bg-dark border-warning shadow-lg">
                <div class="card-body p-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="nombre" class="form-label text-warning fw-semibold fs-5">
                                <i class="fas fa-user me-2"></i>Nombre
                            </label>
                            <input type="text" class="form-control form-control-lg bg-dark text-light border-warning"
                                   id="nombre" name="nombre" required
                                   placeholder="Tu nombre completo"
                                   style="border-radius: 10px;">
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label text-warning fw-semibold fs-5">
                                <i class="fas fa-envelope me-2"></i>Correo electrónico
                            </label>
                            <input type="email" class="form-control form-control-lg bg-dark text-light border-warning"
                                   id="email" name="email" required
                                   placeholder="tu@email.com"
                                   style="border-radius: 10px;">
                        </div>

                        <div class="mb-4">
                            <label for="mensaje" class="form-label text-warning fw-semibold fs-5">
                                <i class="fas fa-comment me-2"></i>Mensaje
                            </label>
                            <textarea class="form-control form-control-lg bg-dark text-light border-warning"
                                      id="mensaje" name="mensaje" rows="6" required
                                      placeholder="Escribe tu mensaje aquí..."
                                      style="border-radius: 10px; resize: vertical;"></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-warning btn-lg px-5 py-3 fw-bold"
                                    style="border-radius: 10px;">
                                <i class="fas fa-paper-plane me-2"></i>Enviar Mensaje
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-5">
                <h4 class="text-warning mb-3">También puedes encontrarme en:</h4>
                <div class="d-flex justify-content-center gap-4">
                    <a href="https://www.linkedin.com/in/elkin-moyon-a9588531b/" target="_blank"
                       class="text-decoration-none">
                        <div class="social-contact-card p-3 border border-warning rounded-3 bg-dark">
                            <i class="fab fa-linkedin text-warning fs-3"></i>
                            <p class="text-light mt-2 mb-0">LinkedIn</p>
                        </div>
                    </a>
                    <a href="https://github.com/ElkinScript" target="_blank"
                       class="text-decoration-none">
                        <div class="social-contact-card p-3 border border-warning rounded-3 bg-dark">
                            <i class="fab fa-github text-warning fs-3"></i>
                            <p class="text-light mt-2 mb-0">GitHub</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
